# Форма «Продукт» (мітка product) — лише для PM, варіант «issues». Одне відкрите issue на репо.
# /requirements-sync розробника копіює текст відкритого issue з міткою product у requirements/product.md:
# заголовки полів — частина домовленості з шаблоном проєкту, не перейменовуйте їх.
# Мітку product PM створює в день 0: форма не створює відсутню мітку.
name: Продукт
description: "Лише для PM. Одне issue на репо: бачення, ролі й права, глосарій, roadmap зрізів, що поза scope. Змінюйте його, а не створюйте нове."
title: "Продукт"
labels: ["product"]
body:
  - type: markdown
    attributes:
      value: |
        **Одне issue «Продукт» на репо, завжди відкрите.** Щоб щось змінити — відредагуйте текст цього issue, а не створюйте нове.
        - Розробники забирають у свої репо **текст цього issue**, а не коментарі.
        - Вимоги з критеріями приймання пишуться не тут, а в окремих issues «Вимога».
        - Сірий текст у полях — приклад з іншої області (міська бібліотека). Пишіть про свій продукт.
        - Репо публічне: жодних справжніх назв клієнта, імен людей, адрес і сум. Пишіть «школа», «агенція», «практика».
  - type: textarea
    id: vision
    attributes:
      label: Бачення
      description: Чия проблема і як її розв'язують зараз; для кого продукт; 2–4 вимірювані ознаки успіху. Не більше пів сторінки.
      placeholder: |
        Проблема: читачі міської бібліотеки не знають, чи є потрібна книжка, поки не прийдуть; бібліотекарі ведуть резерви в зошиті.
        Для кого: читачі й бібліотекарі однієї бібліотеки.
        Ознаки успіху:
        - читач резервує вільну книжку менш ніж за 1 хвилину;
        - бібліотекар бачить усі резерви на сьогодні в одному списку.
    validations:
      required: true
  - type: textarea
    id: roles
    attributes:
      label: Користувачі й ролі
      description: |
        Кожна роль — хто це і як отримує роль. Ідентифікатор ролі — латиницею (`reader`, `admin`): розробники беруть його у свої реалізації.
        Користувачів створює адміністратор: листи-запрошення в навчальному проєкті не надсилаються.
      placeholder: |
        | Роль (ідентифікатор) | Хто це | Як отримує роль |
        |---|---|---|
        | `reader` | читач бібліотеки | створює адміністратор |
        | `librarian` | бібліотекар | призначає адміністратор |
        | `admin` | адміністратор | лише інший адміністратор; сам собі роль не змінює |
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Матриця прав
      description: |
        Роль × дія: що кожна роль може робити з кожним об'єктом. У клітинці — «так», «лише власні», «—».
        Кожна клітинка стане правилом доступу й перевіркою в реалізації кожного розробника.
      placeholder: |
        | Дія | reader | librarian | admin |
        |---|---|---|---|
        | Бачити каталог | так | так | так |
        | Створити резервування | лише власні | — | — |
        | Бачити резервування | лише власні | усі | усі |
        | Видати книжку за резервуванням | — | так | — |
        | Змінити роль користувача | — | — | так, крім власної |
    validations:
      required: true
  - type: textarea
    id: glossary
    attributes:
      label: Глосарій
      description: 8–15 термінів, кожен із «Не вживаємо». Один термін — одне значення в усіх вимогах. Якщо для поняття є кілька слів, оберіть одне, інші впишіть у «Не вживаємо».
      placeholder: |
        | Термін | Визначення | Не вживаємо |
        |---|---|---|
        | Резервування | Запит читача відкласти один примірник книжки на 3 доби | бронь, замовлення |
        | Примірник | Одна фізична книжка з інвентарним номером | екземпляр |
    validations:
      required: true
  - type: textarea
    id: roadmap
    attributes:
      label: Roadmap зрізів
      description: "Зріз — шматок продукту, який можна показати користувачу. По зрізу на кожне заняття WS6–WS11, одним реченням. Перший зріз — до кінця 16.10. У колонці «Вимоги» — назви issues «Вимога», а не номери на кшталт #2 (розробники читають цей текст у своїх репо, де #2 — зовсім інше issue)."
      placeholder: |
        | Заняття | Зріз (що зможе користувач) | Вимоги | Статус |
        |---|---|---|---|
        | WS6 | резервувати книжку й бачити свої резерви | «Вимога: резервування книжки» | у роботі |
        | WS7 | черга на книжку без вільних примірників | — | заплановано |
        | WS8 | продовжити свій резерв ще на 3 доби | — | заплановано |
        | WS9 | бачити історію своїх видач | — | заплановано |
        | WS10 | бібліотекар бачить, які книжки резервують найчастіше | — | заплановано |
        | WS11 | бачити в застосунку нагадування про строк повернення книжки | — | заплановано |
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Що поза scope
      description: Що продукт свідомо НЕ робить. Перші два пункти — обмеження безкоштовних тарифів, на яких працюють розробники; допишіть свої.
      value: |
        - Листи користувачам: у розробників безкоштовна пошта — 2 листи на годину і лише учасникам їхнього проєкту. Нагадування — позначка в застосунку, «запрошення» — посилання від адміністратора.
        - Дії за розкладом частіше ніж раз на добу.
    validations:
      required: true
