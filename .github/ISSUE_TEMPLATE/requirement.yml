# Форма «Вимога» (мітка requirement) — лише для PM, варіант «issues».
# Розробники забирають текст УСІХ відкритих issues з міткою requirement командою /requirements-sync: заголовки полів
# (### Навіщо, ### Критерії приймання …) — частина домовленості з шаблоном проєкту, не перейменовуйте їх.
# Мітку requirement PM створює в день 0: форма не створює відсутню мітку.
# Приклади в placeholder — з нейтральної області (міська бібліотека) і в issue не потрапляють.
name: Вимога
description: "Лише для PM. Одна вимога (зріз або фіча) за шаблоном. Створюйте, коли текст готовий: розробники забирають усі відкриті issues «Вимога»."
title: "Вимога: "
labels: ["requirement"]
body:
  - type: markdown
    attributes:
      value: |
        **Одне issue — одна вимога.** Назва: `Вимога: <що зможе користувач>`, наприклад «Вимога: резервування книжки».
        - Розробники забирають у свої репо **текст цього issue**, а не коментарі. Усе важливе — у полях нижче.
        - Відкрите issue з міткою `requirement` розробники заберуть при наступній синхронізації, тож створюйте його з готовим текстом. **Чернетка** (наприклад, наступного зрізу): назва `Чернетка WS7: …`, і **одразу після створення** зніміть мітку `requirement` (праворуч **Labels**); коли настане час — поверніть мітку й назву `Вимога: …`.
        - Сірий текст у полях — приклад з іншої області (міська бібліотека). Пишіть про свій продукт; ролі й терміни — з issue «Продукт».
        - Не закривайте це issue, поки вимога чинна: закрите issue розробники не отримають.
        - Перевірте себе за [чеклістом](https://github.com/koldovsky/2026-quitcode-06-spec-template/blob/main/docs/checklist.md) (`docs/checklist.md` вашого репо) і напишіть коментар «Перевірено за чеклістом: …».
        - Репо публічне: жодних справжніх назв клієнта, імен людей і їхніх даних.
  - type: textarea
    id: why
    attributes:
      label: Навіщо
      description: Чия проблема і що зміниться, коли вимогу реалізовано. 2–4 речення.
      placeholder: |
        Читачі дізнаються, чи є книжка, лише коли приходять до бібліотеки, і часто йдуть ні з чим.
        Після цієї вимоги читач резервує вільний примірник онлайн і забирає його протягом 3 діб.
    validations:
      required: true
  - type: textarea
    id: roles
    attributes:
      label: Користувачі й ролі
      description: Хто що робить у цій вимозі і чого не бачить. Ролі — з issue «Продукт».
      placeholder: |
        - Читач (`reader`) — резервує книжки, бачить лише власні резервування.
        - Бібліотекар (`librarian`) — бачить усі резервування, видає книжки за резервуванням.
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Основний сценарій
      description: Кроки від початку до результату, нумерованим списком. Без кнопок і екранів — що робить людина і що отримує.
      placeholder: |
        1. Читач знаходить книжку в каталозі і бачить, скільки вільних примірників.
        2. Читач резервує книжку.
        3. Бібліотекар бачить нове резервування в списку на видачу.
        4. Читач приходить протягом 3 діб, бібліотекар видає книжку, резервування закривається.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Критерії приймання
      description: |
        Кожен критерій — окремий пункт списку в **один рядок** (Enter усередині не натискайте): `- AC-<AREA>-<NN>: Дано … Коли … Тоді …`.
        AREA — 2–12 великих **латинських** літер (англійська розкладка: кирилична «А» чи «С» виглядає так само, але агент розробника її не знайде), NN — дві цифри.
        ID унікальний у всьому репо: не повторюйте ID з інших вимог (своя AREA для кожної вимоги або наскрізна нумерація).
        Один критерій — одна поведінка, з конкретними числами. Хоча б один критерій — про помилку чи відмову.
        Змінений критерій зберігає свій ID; прибраний ID ніколи не використовуйте повторно. Розробники називають цими ID свої тести.
      placeholder: |
        - AC-RESERVE-01: Дано читач без активних резервувань і книжка з 2 вільними примірниками. Коли читач резервує книжку. Тоді резервування має статус «очікує видачі», вільних примірників стає 1, а резерв діє 3 доби.
        - AC-RESERVE-02: Дано читач, у якого вже 5 резервувань зі статусом «очікує видачі». Коли він резервує ще одну книжку. Тоді резервування не створюється, і читач бачить повідомлення «Не більше 5 резервувань одночасно».
        - AC-RESERVE-03: Дано резервування, за яким книжку не видали протягом 3 діб. Коли минає третя доба. Тоді не пізніше ніж за 24 години резервування має статус «прострочено», а примірник знову вільний.
        - AC-RESERVE-04: Дано два читачі з резервуваннями. Коли перший відкриває список своїх резервувань. Тоді він бачить лише власні резервування.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Поза межами
      description: Що хтось міг би очікувати від цієї вимоги, але в неї не входить. Якщо нічого — «Немає».
      placeholder: |
        - Черга на книжку без вільних примірників — окрема вимога наступного зрізу.
        - Нагадування листом: читач бачить строк резерву лише в застосунку.
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: Припущення
      description: "Що ви вважаєте правдою, але не перевірили. Розробник покладається на це. Не залишайте порожнім: щонайменше часовий пояс, хто створює дані, одиниці й точність (дати, суми, округлення)."
      placeholder: |
        - Каталог книжок і кількість примірників уже є: їх вносить бібліотекар.
        - Доба рахується за київським часом.
        - Строк резерву рахуємо від моменту резервування з точністю до хвилини: 3 доби — це 72 години.
    validations:
      required: true
  - type: textarea
    id: open_questions
    attributes:
      label: Відкриті питання
      description: Що ще не вирішено. Позначте, якщо питання свідомо лишається поза цим зрізом. Якщо нічого — «Немає».
      placeholder: |
        - Чи може бібліотекар продовжити резерв понад 3 доби? (не в цьому зрізі)
    validations:
      required: true
  - type: textarea
    id: changelog
    attributes:
      label: Журнал змін
      description: |
        Один рядок на зміну: `- РРРР-ММ-ДД — що змінилось — посилання на питання`. Перший рядок — дата створення.
        Посилання на питання — повна адреса issue (скопіюйте з адресного рядка): у вашому репо вона показується як #N, а в копії розробника лишається робочим посиланням.
      placeholder: |
        - 2026-10-16 — створено
        - 2026-10-18 — AC-RESERVE-02: прострочені резервування не рахуються в ліміт 5 — питання https://github.com/<pm>/<team-slug>-spec/issues/7
    validations:
      required: true
