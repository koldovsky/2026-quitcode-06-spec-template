name: Питання до специфікації
description: Розробник питає PM про неоднозначну вимогу чи AC або пропонує змінити вимогу. Відповідь PM потрапляє в product/decisions.md і, якщо змінює поведінку, у нову зміну вимог у main.
title: "[spec-question] AC-…: "
labels: ["spec-question"]
body:
  - type: markdown
    attributes:
      value: |
        Одне issue — одне питання. Текст можна згенерувати скілом `spec-clarify` у своєму репо реалізації й вставити сюди.
        **Пропозицію змінити вимогу** (помилка, прогалина) оформіть так само: варіант A — ваша пропозиція, у «Вплив» — що вона змінить.
        Спершу пошукайте серед issues з міткою `spec-question`: якщо таке питання вже є — додайте коментар із новим випадком або варіантом там.
        Варіанти описують **поведінку** («система відхиляє заявку»), а не реалізацію («додати колонку»).
        Issue публічне: без справжніх назв клієнта, імен людей і їхніх даних — лише терміни з product/glossary.md.
  - type: input
    id: spec_version
    attributes:
      label: Коміт або дата вимог
      description: Яку версію вимог ви читали — коміт із шапки docs/conformance.md у вашому репо (рядок «Вимоги:») або дата запису в product/CHANGELOG.md. Необов'язково.
      placeholder: "коміт 1a2b3c4 або 2026-10-15"
    validations:
      required: false
  - type: input
    id: requirement
    attributes:
      label: Вимога / AC
      description: AC ID і назва вимоги (### Requirement).
      placeholder: "AC-AREA-01 — Requirement: …"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Категорія
      description: Категорія з таксономії неоднозначностей (скіл spec-clarify у вашому репо; та сама таблиця — .claude/skills/spec-review/references/ambiguity-taxonomy.md у цьому репо).
      options:
        - Функціональний обсяг
        - Ролі й доступ
        - Домен і модель даних
        - Потік взаємодії (UX)
        - Нефункціональні вимоги
        - Інтеграції й обмеження платформи
        - Граничні випадки й збої
        - Обмеження й компроміси
        - Термінологія
        - Сигнали завершеності
        - Заглушки й розмиті слова
    validations:
      required: false
  - type: textarea
    id: question
    attributes:
      label: Питання
      description: Що саме неоднозначно і де (цитата з вимоги чи сценарію).
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Варіанти відповіді
      description: 2–5 взаємовиключних варіантів поведінки або «коротка відповідь (≤ 5 слів)».
      placeholder: |
        A) …
        B) …
        C) …
    validations:
      required: true
  - type: input
    id: recommended
    attributes:
      label: Рекомендований варіант
      description: Який варіант радите і чому — одним реченням.
      placeholder: "B — …"
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Вплив
      description: Які AC, тести, дані чи екрани зміняться залежно від відповіді; що ви робите, поки відповіді немає.
    validations:
      required: true
